    <h1>ReturnOrDie</h1>
    <p><strong>應用程式用途：</strong>本應用程式為個人專用的背景備份服務，主要用於自動將本地檔案安全上傳至個人的 Google 雲端硬碟，不收集任何第三方個人資料。</p>
    
    <h2>隱私權政策 (Privacy Policy)</h2>
    <p>ReturnOrDie 僅存取使用者授權的 Google 雲端硬碟目錄，所有上傳的資料皆僅存放在使用者自己的 Google 帳號中，絕不會外流或提供給任何第三方。</p>
    <p>聯絡方式：如有任何疑問請透過 GitHub 與開發者聯繫。</p>
